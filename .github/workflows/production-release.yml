name: Выпуск Timeweb

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Полный SHA проверенного коммита из release/production'
        required: true
        type: string
      expected_live_source_sha:
        description: 'Полный SHA текущего sourceCommit на рабочем сайте'
        required: true
        type: string
      verify_only:
        description: 'Только проверить и собрать пакет без публикации'
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ inputs.verify_only && format('timeweb-verification-{0}', github.run_id) || 'timeweb-production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository_id == '1422714079'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: control
      - name: Проверить источник и текущую версию
        working-directory: control
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          full_sha='^[0-9a-f]{40}$'
          if [[ ! "$SOURCE_SHA" =~ $full_sha || ! "$EXPECTED_LIVE_SHA" =~ $full_sha ]]; then
            echo 'Both revision IDs must be full lowercase commit SHAs.' >&2
            exit 1
          fi
          [[ "$(git rev-parse --verify "$SOURCE_SHA^{commit}")" == "$SOURCE_SHA" ]]
          [[ "$(git rev-parse --verify "$EXPECTED_LIVE_SHA^{commit}")" == "$EXPECTED_LIVE_SHA" ]]
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/release/production; then
            echo 'Release source must be reachable from the protected release/production branch.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_LIVE_SHA" "$SOURCE_SHA"; then
            echo 'Release source must descend from the expected live source.' >&2
            exit 1
          fi
          git worktree add --detach "$GITHUB_WORKSPACE/source" "$SOURCE_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Проверки и тесты
        working-directory: source
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test -- --maxWorkers=2
          node --test gateway/server.test.mjs tests/ops/availability-status.test.mjs
          python3 -m unittest discover -s tests/ops -p 'test_*.py'
          node --test ../control/tests/ops/release-bundle.test.mjs
      - name: Собрать клиент для Timeweb
        working-directory: source
        env:
          VITE_BASE_PATH: /
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: https://api.bronservis.ru
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.PRODUCTION_GOOGLE_DRIVE_CLIENT_ID }}
        shell: bash
        run: |
          VITE_SUPABASE_PUBLISHABLE_KEY=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const published = JSON.parse(readFileSync('../control/deploy/timeweb/availability-public.json', 'utf8'));
          const fallback = published.app_url === 'https://app.bronservis.ru/' &&
            published.api_url === process.env.VITE_SUPABASE_URL ? published.api_anon_key : '';
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY || fallback;
          let publicKey = typeof key === 'string' && key.length <= 4096 && /^sb_publishable_[A-Za-z0-9_-]+$/.test(key);
          if (!publicKey && typeof key === 'string' && key.length <= 4096 && /^[-\w]+\.[-\w]+\.[-\w]+$/.test(key)) {
            const [header, payload] = key.split('.');
            try {
              publicKey = JSON.parse(Buffer.from(header, 'base64url')).alg === 'HS256' &&
                JSON.parse(Buffer.from(payload, 'base64url')).role === 'anon';
            } catch {}
          }
          if (!publicKey) throw new Error('Configure the public production Supabase publishable or legacy anon key.');
          process.stdout.write(key);
          NODE
          )
          export VITE_SUPABASE_PUBLISHABLE_KEY
          npm run build
      - name: Собрать пакет и вычислить контрольную сумму
        id: bundle
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_source_sha }}
        shell: bash
        run: |
          node control/scripts/build-release-bundle.mjs \
            --source "$SOURCE_SHA" --expected-live "$EXPECTED_LIVE_SHA" \
            --site source/dist --migrations source/supabase/migrations --output "$RUNNER_TEMP/bron-release.tar"
          python3 - "$RUNNER_TEMP/bron-release.tar" <<'PY'
          import pathlib, runpy, sys
          read_package = runpy.run_path('control/scripts/production-release.py')['read_package']
          read_package(pathlib.Path(sys.argv[1]).read_bytes())
          PY
          read -r checksum _ < <(sha256sum "$RUNNER_TEMP/bron-release.tar")
          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"
      - name: Сохранить проверенный пакет
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bron-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bron-release.tar
          if-no-files-found: error
          retention-days: 2

  deploy:
    if: github.ref == 'refs/heads/main' && github.repository_id == '1422714079' && !inputs.verify_only
    needs: build
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      id-token: write
    steps:
      - name: Получить артефакт из задания сборки этой попытки
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Сверить пакет
        env:
          BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
        shell: bash
        run: |
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$BUNDLE_SHA256" "$RUNNER_TEMP/release/bron-release.tar" | sha256sum --check --strict
      - name: Подключиться к закрытой сети Timeweb
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:bron-deploy
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking
          use-cache: false
          retry: 1
      - name: Передать пакет серверной команде выпуска
        env:
          PRODUCTION_TAILSCALE_HOST: ${{ vars.PRODUCTION_TAILSCALE_HOST }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress, os
          host = ipaddress.IPv4Address(os.environ['PRODUCTION_TAILSCALE_HOST'])
          if host not in ipaddress.IPv4Network('100.64.0.0/10'):
              raise SystemExit('A literal private Tailscale IPv4 address is required.')
          PY
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$PRODUCTION_DEPLOY_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset PRODUCTION_DEPLOY_SSH_KEY
          awk -v host="$PRODUCTION_TAILSCALE_HOST" 'NF { count++; if ($1 != host || $2 != "ssh-ed25519" || NF != 3) bad=1 } END { exit (count != 1 || bad) }' "$ssh_dir/known_hosts"
          # The Action supplies --accept-routes when connecting. Disable them before SSH.
          sudo -n /usr/local/bin/tailscale set --accept-routes=false
          # Keep access to the daemon's Unix socket and block the proxy's direct IP fallback.
          ssh -F /dev/null -T -i "$ssh_dir/id_ed25519" \
            -o 'ProxyCommand=sudo -n /usr/bin/unshare --net -- /usr/local/bin/tailscale nc %h %p' \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -- "bron-deploy@$PRODUCTION_TAILSCALE_HOST" bron-release-v1 < "$RUNNER_TEMP/release/bron-release.tar"

  check-public:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Проверить кабинет, вход, данные, анкету и резервирование
        env:
          BRON_AVAILABILITY_API_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-availability.mjs
      - name: Сверить опубликованную версию
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://app.bronservis.ru/release-manifest.json', {
            cache: 'no-store', redirect: 'error', signal: AbortSignal.timeout(20_000),
          });
          if (!response.ok || (await response.json()).sourceCommit !== process.env.SOURCE_SHA) {
            throw new Error('The published source does not match the approved release SHA.');
          }
          console.log(`Verified published source ${process.env.SOURCE_SHA}`);
          NODE
