# Бесплатный проект Supabase засыпает после 7 дней без запросов. Раз в два дня обращаемся к публичной команде ping()
# (только publishable-ключ из Variables, секретов нет), чтобы приложение всегда открывалось.
name: keepalive
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /tmp/r -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat /tmp/r)"
          test "$code" = "200"
