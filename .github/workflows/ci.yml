# Проверки каждого изменения (OPS-04): типы, контракт, инварианты БД на PGlite, сборка.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test gateway/server.test.mjs
      - run: node --test tests/ops/availability-status.test.mjs
      - run: node --test tests/ops/manager-recovery-delivery.test.mjs
      - run: node --test tests/ops/royalty-yookassa.test.mjs
      - run: python3 -m unittest discover -s tests/ops -p 'test_backup_alert_telegram.py'
      - run: python3 -B -m unittest discover -s tests/ops -p 'test_manager_recovery_smtp.py'
      - run: python3 -B -m unittest discover -s tests/ops -p 'test_target_backup.py'
      - run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only_placeholder
