name: availability
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: availability
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public services
        run: node scripts/check-availability.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish non-sensitive status and fail on outage
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const text = fs.readFileSync('/tmp/bron-status.json', 'utf8');
            const report = JSON.parse(text);
            const repo = context.repo;
            const branch = 'ops-status';
            try { await github.rest.git.getRef({...repo,ref:`heads/${branch}`}); }
            catch (e) {
              if(e.status!==404)throw e;
              const main=await github.rest.git.getRef({...repo,ref:'heads/main'});
              await github.rest.git.createRef({...repo,ref:`refs/heads/${branch}`,sha:main.data.object.sha});
            }
            let sha;
            try { sha=(await github.rest.repos.getContent({...repo,path:'status.json',ref:branch})).data.sha; }
            catch(e) { if(e.status!==404)throw e; }
            await github.rest.repos.createOrUpdateFileContents({...repo,branch,path:'status.json',sha,message:'Update service availability',content:Buffer.from(text).toString('base64')});
            await core.summary.addHeading('Service availability').addTable([['Service','Result'],...Object.entries(report.checks).map(([name,v])=>[name,v.ok?'OK':`FAILED HTTP ${v.http}`])]).write();
            if(Object.values(report.checks).some(v=>!v.ok))core.setFailed('Availability check failed. See status and recovery runbook.');
