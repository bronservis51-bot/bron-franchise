<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Проверка ввода выручки</title>
<p id="result" role="status">Проверка ввода выручки…</p>
<iframe id="app" title="Кабинет с вымышленными данными" height="850"></iframe>
<script type="module">
// VITE_SUPABASE_URL=https://fixture.example.invalid VITE_SUPABASE_PUBLISHABLE_KEY=synthetic-publishable-key-local-only npm run dev
const frame = document.querySelector('#app');
const result = document.querySelector('#result');
const params = new URLSearchParams(location.search);
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(read) {
  for (let attempt = 0; attempt < 200; attempt++) {
    const value = read();
    if (value) return value;
    await wait(25);
  }
  throw new Error('Экран или результат действия не появился');
}
function button(root, label) {
  return [...root.querySelectorAll('button')].find(node => node.textContent.trim() === label);
}
function assert(condition, message) {
  if (!condition) throw new Error(message);
}
function type(input, value) {
  const { HTMLInputElement, Event } = frame.contentWindow;
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(input, value);
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

frame.width = String(Number(params.get('width')) || 390);
frame.src = `/tests/ui/responsive-app.html?role=franchisee&text=${params.get('text') === '200' ? '200' : '100'}#/`;
try {
  let open = await until(() => button(frame.contentDocument, 'Внести выручку за сегодня'));
  const app = frame.contentWindow;
  assert(!button(app.document.querySelector('main'), 'Отчёт за месяц'), 'На главной осталась кнопка скачивания отчёта');
  assert(!app.document.querySelector('main .day-list2'), 'Детализация по дням осталась на главной');
  const history = app.document.querySelector('.home-finance-link');
  assert(history?.hash.startsWith('#/finance?section=days&month=2026-11-01&location='), 'Детализация не сохраняет выбранный период и точку');
  const missingDay = [...app.document.querySelectorAll('.home-missing-dates a')].find(link => link.textContent === '03.11');
  assert(missingDay?.hash.endsWith('&day=2026-11-03'), 'Пропущенный день нельзя открыть из напоминания');
  const fetchFixture = app.fetch;
  const saves = [];
  const daysOff = new Set();
  const dayOffWrites = [];
  let dayOffUnavailable = false;
  app.fetch = async (request, init) => {
    const url = new URL(request instanceof app.Request ? request.url : request, app.location.href);
    if (url.pathname.endsWith('/rpc/revenue_day_off_set')) {
      if (dayOffUnavailable) return app.Response.json({ message: 'external-unavailable', details: 'Связь прервалась' }, { status: 503 });
      const payload = JSON.parse(init.body);
      dayOffWrites.push(payload);
      if (payload.p_day_off) daysOff.add(payload.p_day);
      else daysOff.delete(payload.p_day);
      return app.Response.json(null);
    }
    const isMonth = url.pathname.endsWith('/rpc/revenue_month');
    if (isMonth || url.pathname.endsWith('/rpc/revenue_overview')) {
      const response = await fetchFixture(request, init);
      const body = await response.json();
      for (const row of isMonth ? [body] : body.rows) {
        row.days_off = [...daysOff];
        row.missing_days = row.missing_days.filter(day => !daysOff.has(day));
      }
      return app.Response.json(body);
    }
    if (url.pathname.endsWith('/rpc/revenue_total_set')) {
      const payload = JSON.parse(init.body);
      saves.push(payload);
      return Promise.resolve(new app.Response(JSON.stringify({ id: 'qa-revenue', total_minor: payload.p_total }), {
        headers: { 'Content-Type': 'application/json' },
      }));
    }
    return fetchFixture(request, init);
  };

  open.click();
  const offDialog = await until(() => app.document.querySelector('dialog[open]'));
  const offOption = [...offDialog.querySelectorAll('label')].find(label => label.textContent.includes('Точка не работала'));
  assert(offOption, 'У пустого дня нет отметки «Выходной»');
  offOption.querySelector('input').click();
  await wait(0);
  assert(!offDialog.querySelector('input[inputmode=decimal]:not([hidden])')?.getClientRects().length, 'для выходного запрашивается сумма');
  dayOffUnavailable = true;
  app.dispatchEvent(new app.Event('offline'));
  button(offDialog, 'Сохранить').click();
  await until(() => offDialog.textContent.includes('Связь прервалась'));
  assert(!dayOffWrites.length && offDialog.open, 'потеря связи не должна подтверждать выходной');
  dayOffUnavailable = false;
  app.dispatchEvent(new app.Event('online'));
  button(offDialog, 'Сохранить').click();
  const todayOff = await until(() => button(app.document, 'Сегодня выходной'));
  assert(dayOffWrites.length === 1 && dayOffWrites[0].p_day_off === true && saves.length === 0, 'выходной отправлен как выручка');
  assert(app.document.querySelector('.home-missing')?.textContent.includes('Не внесена выручка'), 'исчезло напоминание за остальные дни');
  assert(![...app.document.querySelectorAll('.home-missing-dates a')].some(link => link.textContent === '04.11'), 'выходной остался в пропусках');
  todayOff.click();
  const undoDialog = await until(() => app.document.querySelector('dialog[open]'));
  button(undoDialog, 'Отменить выходной').click();
  open = await until(() => button(app.document, 'Внести выручку за сегодня'));
  assert(dayOffWrites.length === 2 && dayOffWrites[1].p_day_off === false && saves.length === 0, 'не удалось отменить выходной');

  const failures = [];
  open.click();
  const draftDialog = await until(() => app.document.querySelector('dialog[open]'));
  const draftInput = draftDialog.querySelector('input[inputmode=decimal]');
  type(draftInput, '12,50x');
  await wait(0);
  button(draftDialog, 'Отмена').click();
  const resume = await until(() => button(draftDialog, 'Продолжить ввод'));
  assert(draftDialog.isConnected, 'закрытие сразу потеряло черновик');
  resume.click();
  await wait(0);
  assert(draftInput.value === '12,50x', 'при возврате потерялся введённый текст');
  button(draftDialog, 'Отмена').click();
  (await until(() => button(draftDialog, 'Отбросить изменения'))).click();
  await until(() => !draftDialog.isConnected);
  assert(saves.length === 0, 'отмена отправила выручку');
  assert(!app.document.querySelector('main')?.textContent.includes('Сравнение с прошлым месяцем'), 'устаревший блок остался на главной');

  const cases = [
    { name: 'исходно пустая сумма', values: [] },
    { name: 'неверный формат после правильной суммы', values: ['12,50', '12,50x'], invalid: true },
    { name: 'сумма выше допустимой', values: ['12,50', '1000000000,01'], invalid: true },
    { name: 'удалённая сумма', values: ['12,50', ''] },
    { name: 'явный ноль после ошибки', values: ['12,50', '12,50x', '0'], total: '0' },
    { name: 'переход к комментарию перед сохранением', values: ['1000000000,01', '12,50'], total: '1250', byKeyboard: true },
    { name: 'максимально допустимая сумма', values: ['1000000000'], total: '100000000000' },
  ];
  for (const { name, values, invalid, total, byKeyboard } of cases) {
    const count = saves.length;
    open.click();
    const dialog = await until(() => app.document.querySelector('dialog[open]'));
    const label = [...dialog.querySelectorAll('label')].find(node => node.textContent.includes('Вся выручка точки за день'));
    const input = app.document.getElementById(label.htmlFor);
    const save = button(dialog, 'Сохранить');
    try {
      for (const value of values) {
        type(input, value);
        await wait(0);
      }
      const page = app.document.documentElement;
      assert(page.scrollWidth <= page.clientWidth, `страница шире окна (${page.scrollWidth} > ${page.clientWidth})`);
      assert(dialog.scrollWidth <= dialog.clientWidth, 'содержимое диалога выходит за его ширину');
      if (byKeyboard) {
        input.dispatchEvent(new app.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        assert(app.document.activeElement === dialog.querySelector('input[type="text"], input:not([type]):not([inputmode=decimal])'), 'клавиатура не перевела фокус к комментарию');
        assert(saves.length === count && dialog.isConnected, 'переход к следующему полю отправил выручку');
      }
      save.click();
      if (total === undefined) {
        await wait(50);
        assert(saves.length === count, `отправлена сумма ${saves.at(-1)?.p_total}`);
        assert(save.disabled, 'кнопка сохранения доступна');
        if (invalid) assert(input.getAttribute('aria-invalid') === 'true', 'поле не помечено как ошибочное');
      } else {
        const payload = await until(() => saves[count]);
        assert(payload.p_total === total, `отправлена сумма ${payload.p_total}, ожидалось ${total}`);
        assert(payload.p_comment === null, 'пустой комментарий должен оставаться необязательным');
        await until(() => !dialog.isConnected);
      }
    } catch (error) {
      failures.push(`${name}: ${error.message}`);
    } finally {
      if (dialog.open) {
        button(dialog, 'Отмена')?.click();
        await wait(0);
        button(dialog, 'Отбросить изменения')?.click();
      }
      await until(() => !dialog.isConnected);
    }
  }
  assert(!failures.length, failures.join(' • '));
  result.dataset.status = 'passed';
  result.textContent = `Проверок пройдено: ${cases.length + 2}`;
} catch (error) {
  result.dataset.status = 'failed';
  result.textContent = error.message;
}
</script>
</html>
