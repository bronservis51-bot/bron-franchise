<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Проверка выбора точки в финансах</title>
<p id="result" role="status">Проверка финансов…</p>
<iframe id="app" title="Кабинет с вымышленными данными" height="850"></iframe>
<script type="module">
// VITE_SUPABASE_URL=https://fixture.example.invalid VITE_SUPABASE_PUBLISHABLE_KEY=synthetic-publishable-key-local-only npm run dev
// Add VITE_GOOGLE_DRIVE_CLIENT_ID=1234567890-fixture.apps.googleusercontent.com and use ?drive=mock to test the Drive upload.
const frame = document.querySelector('#app');
const result = document.querySelector('#result');
const params = new URLSearchParams(location.search);
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(read) {
  for (let attempt = 0; attempt < 200; attempt++) {
    const value = read();
    if (value) return value;
    await wait(25);
  }
  throw new Error('Экран или результат действия не появился');
}
const button = (root, label) => [...root.querySelectorAll('button')].find(node => node.textContent.trim() === label);
const assert = (condition, message) => { if (!condition) throw new Error(message); };
frame.width = String(Number(params.get('width')) || 390);
frame.src = `/tests/ui/responsive-app.html?role=franchisee&text=${params.get('text') === '200' ? '200' : '100'}#/`;

try {
  const link = await until(() => frame.contentDocument.querySelector('a[href="#/finance"]'));
  const app = frame.contentWindow;
  const fetchFixture = app.fetch;
  const scopes = [];
  const saves = [];
  const repeats = [];
  const outlet = { id: 'cb952096-9771-40c8-a182-0cdca77d759c', name: 'Торговый центр с очень длинным названием', status: 'active' };
  const locations = [outlet];
  if (params.get('locations') === '2') locations.push({ id: 'b2c78fff-5142-4c81-8f4e-6b50410b97de', name: 'Вторая торговая точка', status: 'active' });
  const commonExpense = { id: 'qa-expense', category: 'Бухгалтерия', location_id: null, location_name: null,
    amount_minor: 2500, note: null, recurring: true };
  app.fetch = (request, init) => {
    const url = new URL(request instanceof app.Request ? request.url : request, app.location.href);
    if (url.pathname.endsWith('/rpc/finance_my')) {
      const { p_month: month, p_location: scope } = JSON.parse(init.body);
      scopes.push(scope);
      const current = { month, revenue_minor: 15000, cash_minor: 5000, card_minor: 4000, plan_minor: null, pct: null, payroll_minor: 0,
        shifts: 0, rate_bp: 700, royalty_minor: 1050, expenses_minor: scope ? 0 : 2500, net_minor: scope ? 13950 : 11450, is_open: true };
      const closedMonth = new Date(month);
      closedMonth.setUTCMonth(closedMonth.getUTCMonth() - 1);
      const previousMonth = closedMonth.toISOString().slice(0, 10);
      const royalty = { rate_bp: 700, debt_minor: 12500,
        payments: [{ month: previousMonth, paid_on: month, amount_minor: 4800, note: 'Оплата подтверждена' }],
        live: { month, revenue_minor: 15000, accrued_minor: 1050, projected_accrual_minor: 2100 },
        months: [{ month: previousMonth, revenue_minor: 12345678901, rate_bp: 700, accrued_minor: 864197523, manual_minor: -120000, paid_minor: 4800, debt_minor: 12500, is_open: false }] };
      const byLocation = scope ? null : locations.map(location => ({ ...current, location_id: location.id, location_name: location.name }));
      return Promise.resolve(app.Response.json({ partner_name: 'Вымышленный партнёр', currency: 'RUB', month, location_id: scope,
        locations, current, months: [current], by_location: byLocation, by_staff: [], expenses: scope ? [] : [{ ...commonExpense, month }],
        expense_categories: [], prev_expenses_count: 1, royalty: scope ? null : royalty }));
    }
    if (url.pathname.endsWith('/rpc/revenue_month')) {
      const { p_month: month, p_location: scope } = JSON.parse(init.body);
      const point = locations.find(location => location.id === scope);
      const day = month.slice(0, 7) + '-02';
      const missed = month.slice(0, 7) + '-03';
      const row = { day, total_minor: 15000, cash_minor: 10000, card_minor: 5000, reported_total_minor: 12000,
        entries: [{ employee_id: 'test', employee_name: 'Тестовый сотрудник', total_minor: 15000 }] };
      return Promise.resolve(app.Response.json({ month, location_id: scope, location_name: point.name, status: 'active', currency: 'RUB',
        today: month.slice(0, 7) + '-20', days_in_month: 30, days: [row], days_off: [], missing_days: [missed], editable_days: [missed] }));
    }
    if (url.pathname.endsWith('/rpc/expense_repeat_preview')) {
      return Promise.resolve(app.Response.json([{ id: commonExpense.id, category: 'Аренда', location_name: null,
        amount_minor: '10000', updated_at: '2026-11-01T13:00:00Z' }]));
    }
    if (url.pathname.endsWith('/rpc/financial_operation')) {
      const { p_command: command, p_args: args } = JSON.parse(init.body);
      if (command === 'expense_save_with_recurring') {
        saves.push(args);
        return Promise.resolve(app.Response.json(commonExpense.id));
      }
      if (command === 'expense_repeat_checked') {
        repeats.push(args);
        return Promise.resolve(app.Response.json(1));
      }
    }
    return fetchFixture(request, init);
  };
  link.click();
  const doc = app.document;
  const repeatLabel = 'Перенести регулярные расходы';
  const failures = [];
  async function check(name, run) {
    try { await run(); }
    catch (error) { failures.push(`${name}: ${error.message}`); }
    finally {
      const dialog = doc.querySelector('dialog[open]');
      if (dialog) {
        (button(dialog, 'Закрыть') ?? button(dialog, 'Отмена'))?.click();
        await wait(0);
        button(dialog, 'Отбросить изменения')?.click();
      }
    }
  }
  const selectValue = (select, value) => {
    select.value = value;
    select.dispatchEvent(new app.Event('change', { bubbles: true }));
  };
  const fieldValue = (input, value) => {
    Object.getOwnPropertyDescriptor(app.HTMLInputElement.prototype, 'value').set.call(input, value);
    input.dispatchEvent(new app.Event('input', { bubbles: true }));
  };
  const openSection = async (name, selector) => {
    button(doc, name).click();
    return until(() => doc.querySelector(selector));
  };
  await until(() => doc.querySelector('.finance-statement'));

  await check('отчёт с детализацией по всем точкам', async () => {
    assert(scopes[0] === null, 'по умолчанию запрошена отдельная точка');
    assert(doc.querySelector('main h1')?.textContent === 'Отчёт о прибылях и убытках', 'не показан заголовок ОПиУ');
    const report = doc.querySelector('.finance-statement');
    const lines = [...report.querySelectorAll('dt > span')].map(node => node.textContent);
    assert(lines.includes('Остаток по внесённым данным') && lines.includes('Роялти по ставке'), 'нет результата или расчётного роялти');
    assert(lines.includes('Бухгалтерия') && lines.includes('Всего расходов'), 'исчезла фактическая статья или итог расходов');
    assert(['Наличные', 'Карта', 'Способ оплаты не указан'].every(method => lines.includes(method)), 'нет расшифровки выручки');
    assert(report.querySelector('[data-row="article:Бухгалтерия"] small')?.textContent === 'Регулярные', 'потерялся признак регулярного расхода');
    assert(!doc.querySelector('.fin-chart') && !report.textContent.includes('Отчёт составлен по'), 'остался график или пояснение под отчётом');
    assert(doc.querySelector('.finance-filters select').value === '', 'не выбран общий отчёт');
  });
  await check('выручка по дням и история', async () => {
    const daily = await openSection('По дням', '.finance-days');
    const discrepancy = await until(() => [...daily.querySelectorAll('button')].find(node => node.textContent.includes('Сумма смен больше')));
    discrepancy.click();
    const dialog = await until(() => doc.querySelector('dialog[open]'));
    assert(dialog.textContent.includes('Наличные') && dialog.textContent.includes('Карта'), 'в старом дне нет платежей');
    assert(!button(dialog, 'Сохранить'), 'редактируется день вне разрешённого периода');
    button(dialog, 'Закрыть').click();
    const missing = await until(() => [...daily.querySelectorAll('button')].find(node => node.textContent.includes('Пропущено')));
    missing.click();
    assert(missing.getAttribute('aria-pressed') === 'true' || await until(() => missing.getAttribute('aria-pressed') === 'true'), 'не включился фильтр пропусков');
  });
  await check('перенос регулярных расходов', async () => {
    await openSection('Расходы', '.expense-list');
    assert(doc.querySelector('.expense-row').textContent.includes('все точки'), 'в списке потерялось назначение расхода');
    button(doc, repeatLabel).click();
    const dialog = await until(() => doc.querySelector('dialog[open]'));
    const confirm = await until(() => {
      const item = button(dialog, 'Перенести расходы');
      return item && !item.disabled && item;
    });
    confirm.click();
    const request = await until(() => repeats[0]);
    assert(!('p_location' in request) && request.p_rows.length === 1, 'неверная область переноса');
    await until(() => !dialog.isConnected);
  });
  await check('выбор назначения и сохранение общего расхода', async () => {
    button(doc, 'Добавить расход').click();
    const dialog = await until(() => doc.querySelector('dialog[open]'));
    const select = dialog.querySelector('select');
    assert(select?.value === (locations.length === 1 ? outlet.id : ''), 'изменилось начальное назначение расхода');
    assert([...select.options].some(option => option.value === '' && option.textContent === 'Общий — на все точки'), 'нет общего назначения');
    selectValue(select, '');
    fieldValue(dialog.querySelector('input[list]'), 'Аренда');
    fieldValue(dialog.querySelector('input[inputmode=decimal]'), '25,50');
    assert(dialog.scrollWidth <= dialog.clientWidth, 'содержимое диалога выходит за его ширину');
    await wait(0);
    button(dialog, 'Добавить расход').click();
    const save = await until(() => saves[0]);
    assert(save.p_location === null && save.p_amount === '2550' && save.p_note === null, 'неверная сумма или область общего расхода');
    await until(() => !dialog.isConnected);
  });
  await check('неверная сумма в существующем расходе', async () => {
    const count = saves.length;
    doc.querySelector('.expense-row').click();
    const dialog = await until(() => doc.querySelector('dialog[open]'));
    fieldValue(dialog.querySelector('input[inputmode=decimal]'), '25x');
    await wait(0);
    button(dialog, 'Сохранить').click();
    await wait(50);
    assert(saves.length === count, 'неверный ввод отправил предыдущую сумму');
  });
  await check('роялти одной строкой внутри расходов', async () => {
    const report = await until(() => doc.querySelector('.finance-royalty-history'));
    assert(!button(doc, 'Роялти'), 'роялти занимает отдельную вкладку');
    const royalty = doc.querySelector('.finance-royalty-row');
    assert(royalty?.textContent.includes('Роялти по ставке') && !royalty.querySelector('button'), 'строка роялти исчезла или редактируется');
    assert(!report.open, 'история открыта при загрузке');
    report.querySelector('summary').click();
    const debt = report.querySelector('.table td.danger-text');
    assert(debt && app.getComputedStyle(debt).display === 'table-cell', 'долг вышел из своей колонки');
    const region = report.querySelector('.table-wrap');
    assert(region.tabIndex === 0 && app.getComputedStyle(region).overflowX === 'auto', 'широкая таблица недоступна для прокрутки');
    const payments = report.querySelector('.finance-royalty-payments');
    assert(payments.textContent.includes('Оплата подтверждена'), 'оплаты скрыты');
  });
  await check('экран отдельной точки', async () => {
    selectValue(doc.querySelector('.finance-filters select'), outlet.id);
    await until(() => scopes.at(-1) === outlet.id && doc.querySelector('.finance-royalty-row') && !doc.querySelector('.finance-royalty-history'));
    selectValue(doc.querySelector('.finance-filters select'), '');
    await until(() => !app.location.hash.includes('location=') && doc.querySelector('.finance-details'));
    selectValue(doc.querySelector('.finance-filters select'), outlet.id);
    button(doc, 'Расходы').click();
    await until(() => app.location.hash.includes(outlet.id)
      && doc.querySelector('.finance-filters select')?.value === outlet.id
      && button(doc, 'Добавить расход') && !doc.querySelector('.finance-royalty-history'));
    assert(!button(doc, repeatLabel), 'отдельная точка предлагает перенести расходы всего кабинета');
    button(doc, 'Добавить расход').click();
    const dialog = await until(() => doc.querySelector('dialog[open]'));
    assert(dialog.querySelector('select')?.value === outlet.id, 'выбранная точка не подставилась в расход');
  });
  await check('сохранение отчёта для выбранной точки', async () => {
    const upload = [];
    const mockDrive = params.get('drive') === 'mock';
    if (mockDrive) {
      app.google = { accounts: { oauth2: { initTokenClient: ({ callback, scope }) => ({ requestAccessToken: () => {
        callback({ access_token: 'synthetic-drive-access', scope });
      } }) } } };
      const previousFetch = app.fetch;
      app.fetch = async (request, init) => {
        const url = new URL(request instanceof app.Request ? request.url : request, app.location.href);
        if (url.href.startsWith('https://www.googleapis.com/upload/drive/v3/files?')) {
          upload.push({ body: await init.body.text(), authorization: init.headers.Authorization });
          return app.Response.json({ id: 'synthetic-drive-file' });
        }
        return previousFetch(request, init);
      };
    }
    button(doc, 'Google Drive').click();
    const dialog = await until(() => doc.querySelector('dialog[open]'));
    assert(dialog.textContent.includes(outlet.name), 'не показана точка, по которой будет сохранён отчёт');
    assert(button(dialog, 'Скачать отчёт Excel'), 'нет локального скачивания отчёта');
    assert(dialog.querySelector('a[href="https://drive.google.com/drive/my-drive"]'), 'нет пути для ручного сохранения');
    if (mockDrive) {
      const save = await until(() => {
        const control = button(dialog, 'Сохранить в Google Drive');
        return control && !control.disabled && control;
      });
      save.click();
      await until(() => dialog.querySelector('a[href="https://drive.google.com/open?id=synthetic-drive-file"]'));
      assert(upload.length === 1 && upload[0].authorization === 'Bearer synthetic-drive-access', 'файл не отправлен с полученным разрешением');
      assert(upload[0].body.includes('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') && /OPiU-\d{4}-\d{2}\.xlsx/.test(upload[0].body), 'отправлен неверный файл');
    } else {
      assert(!button(dialog, 'Сохранить в Google Drive'), 'предложено прямое сохранение без настройки Google');
      let downloaded;
      const createObjectURL = app.URL.createObjectURL;
      const clickAnchor = app.HTMLAnchorElement.prototype.click;
      try {
        app.URL.createObjectURL = (file) => { downloaded = file; return createObjectURL(file); };
        app.HTMLAnchorElement.prototype.click = function () {
          if (!this.download) clickAnchor.call(this);
        };
        button(dialog, 'Скачать отчёт Excel').click();
        const workbook = await until(() => downloaded);
        const signature = new Uint8Array(await workbook.slice(0, 4).arrayBuffer());
        assert(workbook.name.endsWith('.xlsx') && signature.join(',') === '80,75,3,4', 'локальное скачивание не создало книгу Excel');
      } finally {
        app.URL.createObjectURL = createObjectURL;
        app.HTMLAnchorElement.prototype.click = clickAnchor;
      }
    }
    assert(dialog.scrollWidth <= dialog.clientWidth, 'содержимое диалога выходит за его ширину');
  });
  assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, 'страница финансов шире окна');
  assert(!failures.length, failures.join(' • '));
  result.dataset.status = 'passed';
  result.textContent = 'Проверок пройдено: 8';
} catch (error) {
  result.dataset.status = 'failed';
  result.textContent = error.message;
}
</script>
</html>
