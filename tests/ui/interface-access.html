<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка окон и обновления прав</title>
<output id="result">Проверка…</output>
<iframe id="app" title="Кабинет с вымышленным профилем" width="390" height="760"></iframe>
<script type="module">
const frame = document.querySelector('#app');
const result = document.querySelector('#result');
const networkPermissions = ['org.manage', 'revenue.read', 'kb.read'];

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

async function until(read, failure) {
  const deadline = performance.now() + 10000;
  while (performance.now() < deadline) {
    const value = read();
    if (value) return value;
    await new Promise(resolve => setTimeout(resolve, 30));
  }
  throw new Error(failure);
}

const read = selector => frame.contentDocument.querySelector(selector);
const heading = () => read('main h1')?.textContent;
const button = label => [...frame.contentDocument.querySelectorAll('dialog[open] button')]
  .find(control => control.textContent.trim() === label);

function updatePermissions(permissions) {
  const app = frame.contentWindow;
  app.dispatchEvent(new app.CustomEvent('qa:access', { detail: permissions }));
}

try {
  const fixtureUser = '00000000-0000-4000-8000-000000000001';
  localStorage.setItem(`bron.first-run:${fixtureUser}:manager`, 'seen');
  localStorage.removeItem(`bron.first-run-v2:${fixtureUser}:manager`);
  const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  frame.src = '/tests/ui/responsive-app.html?role=manager&guide=show&access-refresh=1#/rating';
  await loaded;
  const guide = await until(() => read('dialog.first-run-dialog[open]'), 'Первые шаги не открылись');
  const spotlight = await until(() => read('.guide-spotlight[data-target="nav-home"]'), 'Подсветка главной не появилась');
  const target = read('.bottom-nav [data-tour-target="nav-home"]');
  const targetRect = target.getBoundingClientRect();
  const light = spotlight.getBoundingClientRect();
  assert(light.left <= targetRect.left && light.right >= targetRect.right, 'Подсветка не совпала с кнопкой в мобильной навигации');
  const hit = frame.contentDocument.elementFromPoint(targetRect.left + targetRect.width / 2, targetRect.top + targetRect.height / 2);
  assert(guide.contains(hit) && !read('button.guide-spotlight-action'), 'Подсветка текущего экрана не должна менять шаг');
  assert(frame.contentWindow.location.hash === '#/', 'Старая ссылка на рейтинг не вернула на главную');
  assert(!read('.bottom-nav a[href="#/rating"]'), 'Рейтинг остался в меню');
  const cardTop = read('.guide-card').getBoundingClientRect().top;
  button('Далее').click();
  const leadsSpotlight = await until(() => read('button.guide-spotlight-action[data-target="nav-leads"]'), 'Шаг заявок не подсветил ссылку');
  assert(frame.contentWindow.location.hash === '#/', 'Переход между подсказками изменил раздел');
  assert(read('.guide-card').getBoundingClientRect().top === cardTop, 'Карточка с подсказкой сдвинулась');
  leadsSpotlight.click();
  await until(() => heading() === 'Заявки' && read('dialog[open] .guide-spotlight[data-target="nav-leads"]'), 'Подсказка не открыла заявки');
  assert(read('.guide-content h2').textContent === 'Откройте заявки', 'Ссылка изменила шаг подсказки');
  button('Назад').click();
  await until(() => read('dialog[open] .guide-spotlight[data-target="nav-home"]'), 'Возврат по шагам не работает');
  assert(frame.contentWindow.location.hash === '#/leads', 'Возврат к предыдущей подсказке изменил раздел');
  button('Пропустить').click();

  await until(() => heading() === 'Франчайзи' && !read('dialog.first-run-dialog[open]'), 'Пропуск не вернул на главную');
  frame.contentWindow.location.hash = '#/partners/qa-partner';
  await until(() => read('.bottom-nav a[href="#/"][aria-current="location"]'), 'Карточка франчайзи потеряла активную «Главную»');
  frame.contentWindow.location.hash = '#/royalty/qa-partner';
  await until(() => read('.bottom-nav a[href="#/finance"][aria-current="location"]'), 'Карточка роялти потеряла активную «Экономику»');
  read('.bottom-nav a[href="#/finance"]').click();
  await until(() => frame.contentWindow.location.hash === '#/finance' && heading(), 'Не открылась экономика');
  read('[data-tour-target="profile"]').click();
  (await until(() => button('Первые шаги'), 'Из профиля нельзя открыть тур повторно')).click();
  (await until(() => button('Далее'), 'Повторный тур не открылся')).click();
  (await until(() => read('button.guide-spotlight-action[data-target="nav-leads"]'), 'Повторный тур не подсветил заявки')).click();
  await until(() => heading() === 'Заявки', 'Повторный тур не открыл заявки');
  const preview = frame.contentWindow;
  read('dialog.first-run-dialog[open]').dispatchEvent(new preview.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
  await until(() => frame.contentWindow.location.hash === '#/finance' && !read('dialog.first-run-dialog[open]'), 'Escape не вернул исходный раздел');

  updatePermissions(['kb.read']);
  await until(() => heading() === 'Главная' && read('.access-notice'), 'После отзыва права раздел не закрылся');
  assert(!read('.bottom-nav a[href="#/leads"]'), 'Заявки остались в меню после отзыва');

  updatePermissions([...networkPermissions, 'kb.edit']);
  await until(() => read('.bottom-nav a[href="#/leads"]') && read('.bottom-nav [data-tour-target="nav-kb"] .dot'), 'Меню не обновилось после выдачи права');
  read('.bottom-nav a[href="#/leads"]').click();
  const addLead = await until(() => read('.leads-workspace .page-header .btn-primary'), 'Не открылись заявки');
  addLead.click();
  const field = await until(() => read('dialog[open] .lead-editor input'), 'Не открылась форма заявки');
  const app = frame.contentWindow;
  const formRect = field.closest('dialog').getBoundingClientRect();
  const viewport = app.visualViewport;
  assert(Math.abs((formRect.top + formRect.bottom) / 2 - (viewport.offsetTop + viewport.height / 2)) < 2,
    'Форма заявки не по центру видимой области');
  Object.getOwnPropertyDescriptor(app.HTMLInputElement.prototype, 'value').set.call(field, 'Черновик заявки');
  field.dispatchEvent(new app.Event('input', { bubbles: true }));
  await until(() => read('.lead-editor[data-unsaved=true]'), 'Черновик не зафиксирован');
  updatePermissions(networkPermissions);
  await until(() => !read('.bottom-nav [data-tour-target="nav-kb"] .dot'), 'Отзыв права не отразился в меню');
  assert(read('dialog[open] .lead-editor input')?.value === 'Черновик заявки', 'Смена права на базу знаний очистила черновик заявки');
  button('Отмена').click();
  (await until(() => button('Отбросить изменения'), 'Не открылась проверка черновика')).click();
  updatePermissions(['kb.read']);
  await until(() => heading() === 'Главная' && read('.access-notice'), 'Отзыв прав на сеть не закрыл раздел заявок');
  assert(!read('.bottom-nav a[href="#/leads"]'), 'Заявки остались в меню без разрешения');
  updatePermissions(null);
  await until(() => heading() === 'Доступ ещё не выдан', 'Состояние профиля без назначений не показано');
  assert(!read('.bottom-nav'), 'Меню осталось видимым без доступных разделов');

  const articleLoaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  frame.src = '/tests/ui/responsive-app.html?role=manager&kb-draft=1&access-refresh=1#/kb/articles/qa-article';
  await articleLoaded;
  await until(() => heading() === 'Вымышленный черновик', 'Редактор не увидел неопубликованный материал');
  updatePermissions(networkPermissions);
  await until(() => read('main')?.textContent.includes('Статья не найдена'), 'Снятие прав не закрыло неопубликованный материал');
  assert(!read('main')?.textContent.includes('Вымышленный черновик'), 'Старое название черновика осталось на экране');

  const profileLoaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  frame.src = '/tests/ui/responsive-app.html?role=team&qa-profile=dual&qa-legacy-login=1#/';
  await profileLoaded;
  (await until(() => read('[data-tour-target="profile"]'), 'Нет кнопки профиля')).click();
  const profile = await until(() => read('dialog.profile-dialog[open]'), 'Профиль не открылся');
  assert(profile.querySelector('.profile-name strong')?.textContent === 'Вымышленный сотрудник профиля', 'Профиль показал чужое имя');
  assert(!/Вымышленный франчайзи профиля|Менеджер продаж/.test(profile.textContent), 'Профиль показал сырой список назначений');
  assert(profile.querySelector('.profile-name span')?.textContent === 'Управляющий', 'Профиль не показал текущую роль');
  assert(profile.querySelector('.profile-name span:last-child')?.textContent === 'test.owner', 'Профиль не показал логин для входа');
  assert(profile.querySelector('[data-local-work]')?.textContent.includes('Копия и восстановление'), 'Не видно восстановления записей');

  frame.width = 320;
  const narrowLoaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  frame.src = '/tests/ui/responsive-app.html?role=team&text=200&knowledge=1#/kb';
  await narrowLoaded;
  const active = await until(() => read('.bottom-nav a[href="#/kb"][aria-current="page"]'), 'Прямая ссылка не выделила «Знания»');
  const bar = read('.bottom-nav');
  await until(() => active.getBoundingClientRect().right <= bar.getBoundingClientRect().right + 1, 'Активная вкладка недоступна при тексте 200%');
  assert(frame.contentDocument.documentElement.scrollWidth <= frame.contentDocument.documentElement.clientWidth + 1,
    'Нижняя навигация расширила страницу');

  result.textContent = 'PASS. Тур подсвечивает реальные кнопки и открывает разделы. Меню обновляется. Черновик в другом разделе сохранён. Закрытый материал скрыт. Профиль без назначений видит состояние ожидания.';
} catch (error) {
  result.textContent = `FAIL. ${error.message}`;
  throw error;
}
</script>
</html>
