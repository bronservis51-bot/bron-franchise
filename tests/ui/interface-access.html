<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка окон и обновления прав</title>
<output id="result">Проверка…</output>
<iframe id="app" title="Кабинет с вымышленным профилем" width="390" height="760"></iframe>
<script type="module">
const frame = document.querySelector('#app');
const result = document.querySelector('#result');
const networkPermissions = ['org.manage', 'revenue.read', 'kb.read'];

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

async function until(read, failure) {
  const deadline = performance.now() + 10000;
  while (performance.now() < deadline) {
    const value = read();
    if (value) return value;
    await new Promise(resolve => setTimeout(resolve, 30));
  }
  throw new Error(failure);
}

const read = selector => frame.contentDocument.querySelector(selector);
const heading = () => read('main h1')?.textContent;
const button = label => [...frame.contentDocument.querySelectorAll('dialog[open] button')]
  .find(control => control.textContent.trim() === label);

function updatePermissions(permissions) {
  const app = frame.contentWindow;
  app.dispatchEvent(new app.CustomEvent('qa:access', { detail: permissions }));
}

try {
  const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  frame.src = '/tests/ui/responsive-app.html?role=manager&guide=show&access-refresh=1#/rating';
  await loaded;
  const guide = await until(() => read('dialog.first-run-dialog[open]'), 'Первые шаги не открылись');
  const viewport = frame.contentWindow.visualViewport;
  const rect = guide.getBoundingClientRect();
  assert(Math.abs((rect.top + rect.bottom) / 2 - (viewport.offsetTop + viewport.height / 2)) < 2,
    'Вводное обучение не по центру видимой области');
  button('Пропустить').click();

  await until(() => heading() === 'Рейтинг франчайзи', 'Рейтинг недоступен при выданном праве');
  updatePermissions(networkPermissions);
  await until(() => heading() === 'Франчайзи' && read('.access-notice'), 'После отзыва права раздел не закрылся');
  assert(!read('.bottom-nav a[href="#/rating"]'), 'Рейтинг остался в меню после отзыва');

  updatePermissions([...networkPermissions, 'rating.read']);
  await until(() => read('.bottom-nav a[href="#/rating"]'), 'Меню не обновилось после выдачи права');
  read('.bottom-nav a[href="#/leads"]').click();
  const addLead = await until(() => read('.leads-workspace .page-header .btn-primary'), 'Не открылись заявки');
  addLead.click();
  const field = await until(() => read('dialog[open] .lead-editor input'), 'Не открылась форма заявки');
  const app = frame.contentWindow;
  Object.getOwnPropertyDescriptor(app.HTMLInputElement.prototype, 'value').set.call(field, 'Черновик заявки');
  field.dispatchEvent(new app.Event('input', { bubbles: true }));
  await until(() => read('.lead-editor[data-unsaved=true]'), 'Черновик не зафиксирован');
  updatePermissions(networkPermissions);
  await until(() => !read('.bottom-nav a[href="#/rating"]'), 'Отзыв права не отразился в меню');
  assert(read('dialog[open] .lead-editor input')?.value === 'Черновик заявки', 'Смена права на рейтинг очистила черновик заявки');
  button('Отмена').click();
  (await until(() => button('Отбросить изменения'), 'Не открылась проверка черновика')).click();
  updatePermissions(['kb.read']);
  await until(() => heading() === 'Главная' && read('.access-notice'), 'Отзыв прав на сеть не закрыл раздел заявок');
  assert(!read('.bottom-nav a[href="#/leads"]'), 'Заявки остались в меню без разрешения');
  updatePermissions(null);
  await until(() => heading() === 'Доступ ещё не выдан', 'Состояние профиля без назначений не показано');
  assert(!read('.bottom-nav'), 'Меню осталось видимым без доступных разделов');

  const articleLoaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  frame.src = '/tests/ui/responsive-app.html?role=manager&kb-draft=1&access-refresh=1#/kb/articles/qa-article';
  await articleLoaded;
  await until(() => heading() === 'Вымышленный черновик', 'Редактор не увидел неопубликованный материал');
  updatePermissions(networkPermissions);
  await until(() => read('main')?.textContent.includes('Статья не найдена'), 'Снятие прав не закрыло неопубликованный материал');
  assert(!read('main')?.textContent.includes('Вымышленный черновик'), 'Старое название черновика осталось на экране');

  result.textContent = 'PASS. Окно центрируется. Меню обновляется. Черновик в другом разделе сохранён. Закрытый материал скрыт. Профиль без назначений видит состояние ожидания.';
} catch (error) {
  result.textContent = `FAIL. ${error.message}`;
  throw error;
}
</script>
</html>
