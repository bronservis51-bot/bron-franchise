# Apply LAST, after the actual Compose files and maintenance override.
# Publish only web with --no-deps --pull never after the release checks pass.
services:
  web:
    pull_policy: never
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - ./bron/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./bron/site:/srv:ro
      - bron-caddy-data:/data
      - bron-caddy-config:/config
    networks: !override
      - default
      - bron-edge
